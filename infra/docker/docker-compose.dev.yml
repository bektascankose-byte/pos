# Local development stack. Production runs managed Postgres and Redis.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: snappos_migrator
      POSTGRES_PASSWORD: dev_only_not_a_secret
      POSTGRES_DB: snappos
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snappos_migrator -d snappos"]
      interval: 5s
      retries: 10
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=200   # surface slow queries during development

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]

  # S3 compatible object storage. Production uses Cloudflare R2.
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: snappos
      MINIO_ROOT_PASSWORD: dev_only_not_a_secret
    ports: ["9000:9000", "9001:9001"]
    command: server /data --console-address ":9001"
    volumes: [miniodata:/data]

  # Network fault injector. The offline sync harness drops, delays, duplicates
  # and reorders requests through this proxy. See docs/TESTING.md.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:latest
    ports: ["8474:8474", "21080:21080"]

volumes:
  pgdata:
  redisdata:
  miniodata:
